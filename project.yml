# Fallback for Xcode < 16 (no synchronized folders): `brew install xcodegen && xcodegen generate`
name: TerritoryPlanner
options:
  bundleIdPrefix: com.territoryplanner
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
targets:
  TerritoryPlanner:
    type: application
    platform: iOS
    sources:
      - path: TerritoryPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.territoryplanner.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Territory Planner
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Геопозиция нужна, чтобы выбрать центр области по текущему месту и сверять воспроизведение маршрута через Core Location (в том числе Xcode Simulate Location)."
